<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>صفحة خاصة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16191a;--mute:#5d6669;--bg:#f2f3f1}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecea;--mute:#9aa4a6;--bg:#111516}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;line-height:1.8;padding:24px}
main{max-width:34em}
h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px;font-weight:700}
p{margin:0;color:var(--mute);font-size:18px}
code{direction:ltr;unicode-bidi:embed;color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
 <h1>المسار الخاص يعمل</h1>
 <p>هذه صفحة مؤقتة على <code id="h"></code>. لا يوجد فيها دخول بعد، وستحل محلها صفحة المهام بعد ربط Supabase.</p>
</main>
<script>document.getElementById('h').textContent=location.host+location.pathname</script>
</body>
</html>
