<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>مساحتي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1214;--panel:#171B1E;--panel2:#1E2327;--line:#2A3136;--ink:#ECE8DF;--mute:#9AA3A8;
 --gold:#C9B27C;--goldink:#17130A;--ok:#5DB58B;--warn:#D9A441;--bad:#E07A6B;
 --f:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input::placeholder,textarea::placeholder{color:#6B747A}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
select{appearance:auto}
/* الدخول */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;width:100%;max-width:400px}
.card h1{margin:0 0 4px;font-size:28px;font-weight:700}
.card p.sub{margin:0 0 22px;color:var(--mute);font-size:14.5px}
.field{margin-bottom:14px}
.err{color:var(--bad);font-size:14px;min-height:22px;margin:4px 0 10px}
/* التطبيق */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;color:var(--gold)}
.who{color:var(--mute);font-size:13px}
.sp{flex:1}
.tabs{max-width:980px;margin:0 auto;padding:0 20px;display:flex;gap:6px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:22px 20px 80px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:18px}
.hint{color:var(--mute);font-size:13.5px;margin:0 0 12px}
/* المهام */
.addrow{display:grid;grid-template-columns:2.4fr 1.2fr 1fr 1.2fr auto;gap:10px;align-items:end}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:600}
.chip i{font-style:normal;opacity:.75;margin-right:6px;font-variant-numeric:tabular-nums}
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.task.done .ttl{text-decoration:line-through;color:var(--mute)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--gold)}
.chk[aria-pressed="true"]::after{content:"✓";color:var(--goldink);font-size:14px;font-weight:700}
.ttl{font-weight:500;overflow-wrap:anywhere}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:12.5px}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--mute)}
.tag.wait{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.due{color:var(--mute)}.due.over{color:var(--bad);font-weight:600}.due.today{color:var(--warn);font-weight:600}
.pri{width:10px;height:10px;border-radius:50%;background:var(--line)}
.p-high{background:var(--bad)}.p-normal{background:var(--warn)}.p-low{background:var(--ok)}
.acts{display:flex;gap:6px;opacity:.85}
.acts button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mute);padding:3px 9px;font-size:12.5px;cursor:pointer}
.acts button:hover{color:var(--ink);border-color:var(--gold)}
.empty{color:var(--mute);text-align:center;padding:28px 0;border:1px dashed var(--line);border-radius:14px}
/* الأرقام */
.cos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.wk{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.wk b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-right:4px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi.ok{border-right-color:var(--ok)}.kpi.warn{border-right-color:var(--warn)}.kpi.bad{border-right-color:var(--bad)}
.kpi .lb{color:var(--mute);font-size:13px;display:block}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2}
.kpi .v small{font-size:14px;font-weight:500;color:var(--mute)}
.kpi .m{font-size:12.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.init{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:8px}
.sv{display:flex;gap:6px}
.sv button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.sv button[aria-pressed="true"]{color:#0F1214;font-weight:600;border-color:transparent}
.sv .g[aria-pressed="true"]{background:var(--ok)}.sv .y[aria-pressed="true"]{background:var(--warn)}.sv .r[aria-pressed="true"]{background:var(--bad)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
textarea{min-height:70px;resize:vertical}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
th{background:var(--panel2);text-align:start;padding:9px 12px;font-weight:600;color:var(--mute);font-size:13px}
td{padding:9px 12px;border-top:1px solid var(--line)}
tr.cur td{background:color-mix(in srgb,var(--gold) 10%,transparent);font-weight:600}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
#toast.bad{border-color:var(--bad);color:var(--bad)}
@media (max-width:820px){
 .addrow{grid-template-columns:1fr 1fr}.addrow .full{grid-column:1/-1}
 .kpis{grid-template-columns:1fr 1fr}.notes{grid-template-columns:1fr}
 .task{grid-template-columns:auto 1fr auto}.acts{grid-column:1/-1;justify-content:flex-start}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="login" class="center" hidden>
 <form class="card" id="loginForm" autocomplete="on">
  <h1>مساحتي</h1>
  <p class="sub">دخول خاص. مهامي وأرقام الأسبوع.</p>
  <div class="field"><label for="em">الإيميل</label><input id="em" type="email" name="email" autocomplete="username" required dir="ltr"></div>
  <div class="field"><label for="pw">كلمة السر</label><input id="pw" type="password" name="password" autocomplete="current-password" required dir="ltr"></div>
  <div class="err" id="loginErr" role="alert"></div>
  <button class="btn gold" id="loginBtn" style="width:100%;padding:11px" type="submit">دخول</button>
 </form>
</div>

<div id="app" hidden>
 <header class="top">
  <div class="bar">
   <span class="brand">مساحتي</span><span class="who" id="who"></span><span class="sp"></span>
   <button class="btn sm" id="logout">خروج</button>
  </div>
  <div class="tabs" role="tablist">
   <button class="tab" role="tab" id="tabT" aria-selected="true">المهام</button>
   <button class="tab" role="tab" id="tabB" aria-selected="false">الأرقام الأربعة</button>
  </div>
 </header>
 <main>
  <section id="tasksView">
   <form class="panel" id="addForm">
    <div class="addrow">
     <div class="full"><label for="nt">مهمة جديدة</label><input id="nt" placeholder="وش تبي تنجز؟" maxlength="300" autocomplete="off"></div>
     <div><label for="nc">الشركة</label><select id="nc"></select></div>
     <div><label for="np">الأولوية</label><select id="np"><option value="high">عالية</option><option value="normal" selected>عادية</option><option value="low">منخفضة</option></select></div>
     <div><label for="nd">الموعد</label><input id="nd" type="date"></div>
     <button class="btn gold" type="submit" style="padding:10px 18px">إضافة</button>
    </div>
   </form>
   <div class="chips" id="chips"></div>
   <ul class="tasks" id="list"></ul>
  </section>

  <section id="boardView" hidden>
   <div class="cos" id="cos"></div>
   <div class="wk"><button class="btn sm" id="prevW">◀ السابق</button><b id="wlab"></b><button class="btn sm" id="nextW">التالي ▶</button></div>
   <div class="kpis" id="kpis"></div>
   <div class="panel"><h2>أرقام الأسبوع</h2><p class="hint">تعبئها الخميس وتقرأها الأحد.</p><div class="grid4" id="form"></div></div>
   <div class="panel"><h2>أهم ثلاث مبادرات</h2><p class="hint">أخضر يسير، أصفر فيه عائق، أحمر متوقف.</p><div id="inits"></div></div>
   <div class="panel"><h2>إغلاق الأسبوع</h2><div class="notes" id="notes"></div></div>
   <div class="panel"><h2>آخر 8 أسابيع</h2><div class="tw" id="hist"></div></div>
   <div class="panel"><h2>المستهدفات الأسبوعية</h2><p class="hint">عدّلها لما تتغير الخطة.</p><div class="grid4" id="targets"></div></div>
  </section>
 </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ====== الإعدادات (المفتاح عام بتصميمه، وحماية البيانات من قفل الجداول RLS) ====== */
const SB_URL='https://msjsuhjgdedihzxtbems.supabase.co';
const SB_KEY='sb_publishable_SBktBUVHARZmYUFezgOXWg_FEmmUqOj';
const SKEY='hamad-session-v1';

const COMP={
 venues:{n:'نوكس فينيوز',lead:'الليدز المؤهلة',t:{lead:37,cpl:250,resp:90}},
 noqoosh:{n:'نقوش',lead:'الاستفسارات المؤهلة',t:{lead:14,cpl:150,resp:90}},
 rahi:{n:'راهي',lead:'الليدز المؤهلة',t:{lead:8,cpl:300,resp:90}},
 events:{n:'نوكس للفعاليات',lead:'الفرص الجديدة',t:{lead:1,cpl:0,resp:90}},
 creative:{n:'كرييتف هاوس',lead:'طلبات الأجنحة',t:{lead:3,cpl:350,resp:90}},
 group:{n:'المجموعة',lead:'اجتماعات الحسابات',t:{lead:2,cpl:0,resp:90}}
};
const TASKCO=Object.assign({},Object.fromEntries(Object.entries(COMP).map(([k,v])=>[k,v.n])),{personal:'شخصي'});

/* ====== أدوات ====== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=(d=new Date())=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return ymd(x)};
const fmtD=s=>parseYmd(s).toLocaleDateString('ar-u-ca-gregory-nu-latn',{day:'numeric',month:'short'});
const todayS=()=>ymd(new Date());
const num=v=>{const n=parseFloat(String(v??'').replace(/[^\d.]/g,''));return isNaN(n)?null:n};
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
let toastT;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className='on'+(bad?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',bad?4500:1800)}

/* ====== الجلسة ====== */
let S=null,refreshing=null;
function loadSession(){try{S=JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){S=null}}
function saveSession(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
function clearSession(){S=null;try{localStorage.removeItem(SKEY)}catch(e){}}
function setSession(j){
 S={access_token:j.access_token,refresh_token:j.refresh_token,
    expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),
    user:{id:j.user.id,email:j.user.email}};
 saveSession();
}
async function login(email,password){
 const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){
  const m=(j.error_description||j.msg||j.message||'').toLowerCase();
  throw new Error(m.includes('invalid')?'الإيميل أو كلمة السر غير صحيحة':(j.error_description||j.msg||j.message||'تعذر تسجيل الدخول'));
 }
 setSession(j);
}
function refresh(){
 if(refreshing) return refreshing;
 refreshing=(async()=>{
  if(!S||!S.refresh_token) throw new Error('no-session');
  let r;
  try{r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh_token})})}
  catch(e){throw new Error('تعذر الاتصال، تأكد من الإنترنت')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){clearSession();throw new Error('no-session')}
  setSession(j);
 })().finally(()=>{refreshing=null});
 return refreshing;
}
async function api(path,opt={}){
 if(!S) throw new Error('no-session');
 if(S.expires_at-Math.floor(Date.now()/1000)<60) await refresh();
 const go=()=>fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',
  headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},opt.prefer?{Prefer:opt.prefer}:{}),
  body:opt.body!==undefined?JSON.stringify(opt.body):undefined});
 let r;
 try{r=await go()}catch(e){throw new Error('تعذر الاتصال، تأكد من الإنترنت')}
 if(r.status===401){await refresh();r=await go()}
 if(!r.ok){
  const t=await r.text();let m=t;
  try{const j=JSON.parse(t);m=j.message||j.hint||t}catch(e){}
  throw new Error(m||('خطأ '+r.status));
 }
 const txt=await r.text();return txt?JSON.parse(txt):null;
}

/* ====== الشاشات ====== */
function showLogin(msg){
 $('app').hidden=true;$('login').hidden=false;
 $('loginErr').textContent=msg||'';
 $('pw').value='';
 setTimeout(()=>$($('em').value?'pw':'em').focus(),50);
}
async function showApp(){
 $('login').hidden=true;$('app').hidden=false;
 $('who').textContent=S.user.email;
 try{
  await Promise.all([loadTasks(),loadKV()]);
 }catch(e){
  if(e.message==='no-session'){showLogin('انتهت الجلسة، سجّل دخولك من جديد');return}
  toast(e.message,true);
 }
 renderTasks();renderBoard();
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const b=$('loginBtn');b.disabled=true;b.textContent='جاري الدخول...';$('loginErr').textContent='';
 try{await login($('em').value.trim(),$('pw').value);await showApp()}
 catch(err){$('loginErr').textContent=err.message}
 finally{b.disabled=false;b.textContent='دخول'}
});
$('logout').addEventListener('click',async()=>{
 try{if(S) await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+S.access_token}})}catch(e){}
 clearSession();TASKS=[];KV={};showLogin('');
});
function setTab(t){
 const isT=t==='t';
 $('tasksView').hidden=!isT;$('boardView').hidden=isT;
 $('tabT').setAttribute('aria-selected',isT);$('tabB').setAttribute('aria-selected',!isT);
}
$('tabT').onclick=()=>setTab('t');$('tabB').onclick=()=>setTab('b');

/* ====== المهام ====== */
let TASKS=[],FILTER='today';
async function loadTasks(){TASKS=await api('tasks?select=*&order=created_at.desc')||[]}
const PRI={high:0,normal:1,low:2};
function bucketOf(t){
 const td=todayS(),wk=addDays(td,7);
 return {
  today:t.status!=='done'&&t.due&&t.due<=td,
  week:t.status!=='done'&&t.due&&t.due>td&&t.due<=wk,
  waiting:t.status==='waiting',
  nodate:t.status==='todo'&&!t.due,
  all:t.status!=='done',
  done:t.status==='done'
 };
}
function sortTasks(a,b){
 if(a.status==='done'&&b.status==='done') return (b.done_at||'').localeCompare(a.done_at||'');
 const pa=PRI[a.priority]??1,pb=PRI[b.priority]??1;
 if(pa!==pb) return pa-pb;
 if(a.due&&b.due&&a.due!==b.due) return a.due<b.due?-1:1;
 if(a.due&&!b.due) return -1;if(!a.due&&b.due) return 1;
 return (b.created_at||'').localeCompare(a.created_at||'');
}
function dueInfo(d){
 const td=todayS();
 if(d===td) return {txt:'اليوم',cls:'today'};
 if(d===addDays(td,1)) return {txt:'غداً',cls:''};
 if(d<td){const n=Math.round((parseYmd(td)-parseYmd(d))/864e5);return {txt:`متأخرة ${n} ${n===1?'يوم':'أيام'}`,cls:'over'}}
 return {txt:fmtD(d),cls:''};
}
const CHIPS=[['today','اليوم'],['week','هذا الأسبوع'],['waiting','بانتظار رد'],['nodate','بدون موعد'],['all','الكل'],['done','منتهية']];
function renderTasks(){
 const counts={};CHIPS.forEach(([k])=>counts[k]=0);
 TASKS.forEach(t=>{const b=bucketOf(t);CHIPS.forEach(([k])=>{if(b[k])counts[k]++})});
 $('chips').innerHTML=CHIPS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${FILTER===k}">${l}<i>${counts[k]}</i></button>`).join('');
 let rows=TASKS.filter(t=>bucketOf(t)[FILTER]).sort(sortTasks);
 if(FILTER==='done') rows=rows.slice(0,40);
 $('list').innerHTML=rows.length?rows.map(taskRow).join(''):
  `<li class="empty">${FILTER==='today'?'ما عندك مهام لليوم. استمتع، أو أضف مهمة فوق.':'لا يوجد شيء هنا.'}</li>`;
}
function taskRow(t){
 const d=t.due?dueInfo(t.due):null;
 return `<li class="task ${t.status==='done'?'done':''}" data-id="${esc(t.id)}">
  <button class="chk" data-a="toggle" aria-pressed="${t.status==='done'}" aria-label="إنجاز المهمة"></button>
  <div><div class="ttl">${esc(t.title)}</div>
   <div class="tmeta"><span class="tag">${esc(TASKCO[t.company]||t.company)}</span>${d?`<span class="due ${d.cls}">${esc(d.txt)}</span>`:''}${t.status==='waiting'?'<span class="tag wait">بانتظار رد</span>':''}</div></div>
  <span class="pri p-${esc(t.priority)}" title="الأولوية"></span>
  <div class="acts"><button data-a="wait">${t.status==='waiting'?'استئناف':'بانتظار رد'}</button><button data-a="edit">تعديل</button><button data-a="del">حذف</button></div>
 </li>`;
}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;FILTER=b.dataset.f;renderTasks()});
$('list').addEventListener('click',async e=>{
 const btn=e.target.closest('[data-a]');if(!btn)return;
 const li=btn.closest('.task');const t=TASKS.find(x=>x.id===li.dataset.id);if(!t)return;
 const a=btn.dataset.a;
 try{
  if(a==='toggle'){
   const done=t.status!=='done';
   const [u]=await api('tasks?id=eq.'+encodeURIComponent(t.id),{method:'PATCH',prefer:'return=representation',body:{status:done?'done':'todo',done_at:done?new Date().toISOString():null}});
   Object.assign(t,u);
  }else if(a==='wait'){
   const [u]=await api('tasks?id=eq.'+encodeURIComponent(t.id),{method:'PATCH',prefer:'return=representation',body:{status:t.status==='waiting'?'todo':'waiting'}});
   Object.assign(t,u);
  }else if(a==='edit'){
   const nv=prompt('عدّل المهمة',t.title);
   if(nv===null||!nv.trim()||nv.trim()===t.title) return;
   const [u]=await api('tasks?id=eq.'+encodeURIComponent(t.id),{method:'PATCH',prefer:'return=representation',body:{title:nv.trim().slice(0,300)}});
   Object.assign(t,u);
  }else if(a==='del'){
   if(!confirm('حذف هذه المهمة؟')) return;
   await api('tasks?id=eq.'+encodeURIComponent(t.id),{method:'DELETE'});
   TASKS=TASKS.filter(x=>x.id!==t.id);
  }
  renderTasks();
 }catch(err){
  if(err.message==='no-session'){showLogin('انتهت الجلسة، سجّل دخولك من جديد');return}
  toast(err.message,true);
 }
});
(function initAdd(){
 const sel=$('nc');
 sel.innerHTML=Object.entries(TASKCO).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');
 try{const last=localStorage.getItem('hamad-lastco');if(last&&TASKCO[last])sel.value=last;else sel.value='personal'}catch(e){sel.value='personal'}
})();
$('addForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const title=$('nt').value.trim();if(!title){$('nt').focus();return}
 const body={title:title.slice(0,300),company:$('nc').value,priority:$('np').value,due:$('nd').value||null,user_id:S.user.id};
 try{
  const [row]=await api('tasks',{method:'POST',prefer:'return=representation',body});
  TASKS.unshift(row);
  $('nt').value='';$('nd').value='';
  try{localStorage.setItem('hamad-lastco',body.company)}catch(e2){}
  if(!bucketOf(row)[FILTER]) FILTER=row.due?(row.due<=todayS()?'today':'week'):'nodate';
  renderTasks();toast('انضافت المهمة');$('nt').focus();
 }catch(err){
  if(err.message==='no-session'){showLogin('انتهت الجلسة، سجّل دخولك من جديد');return}
  toast(err.message,true);
 }
});

/* ====== الأرقام الأربعة (تُحفظ في جدول kv) ====== */
let KV={},CUR='venues',WEEK=weekStart();
async function loadKV(){
 const rows=await api('kv?select=key,value')||[];
 KV={};rows.forEach(r=>KV[r.key]=r.value);
}
async function saveKV(key,value){
 KV[key]=value;
 await api('kv?on_conflict=user_id,key',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',
  body:{user_id:S.user.id,key,value,updated_at:new Date().toISOString()}});
}
const wkey=(co,w)=>`w|${co}|${w}`;
const rec=(co,w)=>KV[wkey(co,w)]||{};
const targetsOf=co=>Object.assign({},COMP[co].t,(KV.targets||{})[co]||{});
async function setRec(co,w,patch){
 try{await saveKV(wkey(co,w),Object.assign({},rec(co,w),patch));toast('حُفظ')}
 catch(err){if(err.message==='no-session'){showLogin('انتهت الجلسة، سجّل دخولك من جديد');return false}toast(err.message,true);return false}
 return true;
}
const cplOf=r=>{const l=num(r.lead),s=num(r.spend);return(l&&s!=null)?s/l:null};
function statusOf(co){
 const r=rec(co,WEEK),t=targetsOf(co),l=num(r.lead);if(l==null)return'none';
 let bad=0,warn=0;
 if(l<t.lead*.8)bad++;else if(l<t.lead)warn++;
 const cp=cplOf(r);if(cp!=null&&t.cpl){if(cp>t.cpl*1.2)bad++;else if(cp>t.cpl)warn++}
 const rs=num(r.resp);if(rs!=null){if(rs<t.resp*.8)bad++;else if(rs<t.resp)warn++}
 return bad?'bad':(warn?'warn':'ok');
}
const DOT={ok:'var(--ok)',warn:'var(--warn)',bad:'var(--bad)',none:'var(--line)'};
function delta(cur,prev,lowerBetter){
 if(cur==null||prev==null||prev===0)return'<span>—</span>';
 const p=(cur-prev)/prev*100,good=lowerBetter?p<0:p>0,flat=Math.abs(p)<2;
 return `<span class="${flat?'':(good?'up':'dn')}">${p>0?'▲':'▼'} ${Math.abs(p).toFixed(0)}%</span>`;
}
function renderBoard(){
 const c=COMP[CUR],t=targetsOf(CUR),r=rec(CUR,WEEK),pr=rec(CUR,addDays(WEEK,-7));
 $('cos').innerHTML=Object.entries(COMP).map(([k,v])=>`<button class="chip" data-co="${k}" aria-pressed="${k===CUR}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${DOT[statusOf(k)]};margin-left:7px"></span>${esc(v.n)}</button>`).join('');
 $('wlab').textContent=`أسبوع ${fmtD(WEEK)} – ${fmtD(addDays(WEEK,6))}`;
 const cp=cplOf(r),pcp=cplOf(pr),resp=num(r.resp),lead=num(r.lead);
 const ins=[1,2,3].map(i=>r['is'+i]).filter(Boolean);
 const bad=ins.filter(s=>s==='r').length,warn=ins.filter(s=>s==='y').length;
 const ist=!ins.length?'':(bad?'bad':(warn?'warn':'ok'));
 const cards=[
  {lb:c.lead,v:fmt(lead),u:'',cls:lead==null?'':(lead>=t.lead?'ok':(lead>=t.lead*.8?'warn':'bad')),m:[`المستهدف ${t.lead}`,delta(lead,num(pr.lead))]},
  {lb:'تكلفة الليد',v:cp==null?'—':fmt(cp),u:'ريال',cls:(cp==null||!t.cpl)?'':(cp<=t.cpl?'ok':(cp<=t.cpl*1.2?'warn':'bad')),m:[t.cpl?`المستهدف ${t.cpl} فأقل`:'بلا مستهدف',delta(cp,pcp,true)]},
  {lb:'الرد خلال ساعتين',v:resp==null?'—':fmt(resp),u:'%',cls:resp==null?'':(resp>=t.resp?'ok':(resp>=t.resp*.8?'warn':'bad')),m:[`المستهدف ${t.resp}%`,delta(resp,num(pr.resp))]},
  {lb:'حالة المبادرات',v:ins.length?`${ins.filter(s=>s==='g').length}/${ins.length}`:'—',u:'تسير',cls:ist,m:[bad?`${bad} متوقفة`:'',warn?`${warn} فيها عائق`:''].filter(Boolean)}
 ];
 $('kpis').innerHTML=cards.map(k=>`<div class="kpi ${k.cls}"><span class="lb">${esc(k.lb)}</span><div class="v num">${k.v} ${k.u?`<small>${k.u}</small>`:''}</div><div class="m">${k.m.map(x=>x.startsWith('<')?x:`<span>${esc(x)}</span>`).join('')}</div></div>`).join('');
 $('form').innerHTML=`
  <div><label>${esc(c.lead)} هذا الأسبوع</label><input class="num" inputmode="numeric" data-f="lead" value="${esc(r.lead??'')}"></div>
  <div><label>الإنفاق الإعلاني (ريال)</label><input class="num" inputmode="numeric" data-f="spend" value="${esc(r.spend??'')}"></div>
  <div><label>نسبة الرد خلال ساعتين (%)</label><input class="num" inputmode="numeric" data-f="resp" value="${esc(r.resp??'')}"></div>
  <div><label>صفقات أو حجوزات أُغلقت</label><input class="num" inputmode="numeric" data-f="deals" value="${esc(r.deals??'')}"></div>`;
 $('inits').innerHTML=[1,2,3].map(i=>`<div class="init"><input data-f="in${i}" placeholder="المبادرة ${i}" value="${esc(r['in'+i]||'')}">
  <div class="sv" data-i="${i}"><button class="g" data-s="g" aria-pressed="${r['is'+i]==='g'}">يسير</button><button class="y" data-s="y" aria-pressed="${r['is'+i]==='y'}">عائق</button><button class="r" data-s="r" aria-pressed="${r['is'+i]==='r'}">متوقف</button></div></div>`).join('');
 $('notes').innerHTML=`
  <div><label>ما الذي تحرك</label><textarea data-f="n1">${esc(r.n1||'')}</textarea></div>
  <div><label>العائق الأكبر</label><textarea data-f="n2">${esc(r.n2||'')}</textarea></div>
  <div><label>قرار الأسبوع القادم</label><textarea data-f="n3">${esc(r.n3||'')}</textarea></div>`;
 const weeks=[];for(let i=0;i<8;i++)weeks.push(addDays(WEEK,-7*i));
 $('hist').innerHTML=`<table><thead><tr><th>الأسبوع</th><th>${esc(c.lead)}</th><th>تكلفة الليد</th><th>الرد %</th><th>صفقات</th></tr></thead><tbody>${weeks.map(w=>{const rr=rec(CUR,w),cc=cplOf(rr);
  return `<tr class="${w===WEEK?'cur':''}"><td>${fmtD(w)}</td><td class="num">${fmt(num(rr.lead))}</td><td class="num">${cc==null?'—':fmt(cc)}</td><td class="num">${rr.resp?esc(rr.resp)+'%':'—'}</td><td class="num">${fmt(num(rr.deals))}</td></tr>`}).join('')}</tbody></table>`;
 $('targets').innerHTML=`
  <div><label>مستهدف ${esc(c.lead)} أسبوعياً</label><input class="num" inputmode="numeric" data-t="lead" value="${t.lead}"></div>
  <div><label>سقف تكلفة الليد (ريال)</label><input class="num" inputmode="numeric" data-t="cpl" value="${t.cpl}"></div>
  <div><label>مستهدف الرد خلال ساعتين (%)</label><input class="num" inputmode="numeric" data-t="resp" value="${t.resp}"></div>`;
}
$('boardView').addEventListener('change',async e=>{
 const el=e.target;
 if(el.dataset.f){await setRec(CUR,WEEK,{[el.dataset.f]:el.value});renderBoard()}
 else if(el.dataset.t){
  const v=num(el.value);const all=Object.assign({},KV.targets||{});
  all[CUR]=Object.assign({},all[CUR]||{},{[el.dataset.t]:v==null?0:v});
  try{await saveKV('targets',all);toast('حُفظ')}catch(err){toast(err.message,true)}
  renderBoard();
 }
});
$('boardView').addEventListener('click',async e=>{
 const co=e.target.closest('[data-co]');
 if(co){CUR=co.dataset.co;renderBoard();return}
 const sv=e.target.closest('.sv button');
 if(sv){const i=sv.parentElement.dataset.i,cur=rec(CUR,WEEK)['is'+i];await setRec(CUR,WEEK,{['is'+i]:cur===sv.dataset.s?'':sv.dataset.s});renderBoard()}
});
$('prevW').onclick=()=>{WEEK=addDays(WEEK,-7);renderBoard()};
$('nextW').onclick=()=>{WEEK=addDays(WEEK,7);renderBoard()};

/* ====== البداية ====== */
(async function init(){
 loadSession();
 if(!S){showLogin('');return}
 await showApp();
})();
</script>
