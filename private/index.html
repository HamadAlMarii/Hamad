<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>مساحتي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1214;--panel:#171B1E;--panel2:#1E2327;--line:#2A3136;--ink:#ECE8DF;--mute:#9AA3A8;
 --gold:#C9B27C;--goldink:#17130A;--ok:#5DB58B;--warn:#D9A441;--bad:#E07A6B;--info:#6AA9D9;
 --f:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.amt{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:600}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.sm{padding:4px 10px;font-size:13px}
a.btn{color:var(--ink);text-decoration:none;display:inline-block}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:42px;cursor:pointer}
input::placeholder,textarea::placeholder{color:#6B747A}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
textarea{min-height:76px;resize:vertical;line-height:1.7}
/* الدخول */
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;width:100%;max-width:400px}
.card h1{margin:0 0 4px;font-size:28px;font-weight:700}
.card p.sub{margin:0 0 22px;color:var(--mute);font-size:14.5px}
.field{margin-bottom:14px}
.err{color:var(--bad);font-size:14px;min-height:22px;margin:4px 0 10px}
/* الهيكل */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;color:var(--gold)}
.who{color:var(--mute);font-size:13px}
.sp{flex:1}
.tabs{max-width:1080px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:20px 20px 90px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:18px}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--gold)}
.hint{color:var(--mute);font-size:13.5px;margin:0 0 12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* بطاقات الأرقام */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-right:4px solid var(--line);border-radius:14px;padding:14px 16px;text-align:start}
.stat.ok{border-right-color:var(--ok)}.stat.warn{border-right-color:var(--warn)}.stat.bad{border-right-color:var(--bad)}.stat.info{border-right-color:var(--info)}.stat.gold{border-right-color:var(--gold)}
.stat .lb{color:var(--mute);font-size:13px;display:block}
.stat .v{font-size:26px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.stat .v small{font-size:13px;font-weight:500;color:var(--mute)}
.stat .m{font-size:12.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
button.stat{cursor:pointer;font:inherit;color:inherit;width:100%}
button.stat:hover{border-color:var(--gold)}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
.pb{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.pb>i{display:block;height:100%;background:var(--gold);border-radius:5px;transition:width .5s}
/* قوائم */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:600}
.chip i{font-style:normal;opacity:.75;margin-right:6px;font-variant-numeric:tabular-nums}
.li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .tt{font-weight:500;overflow-wrap:anywhere}
.li .ss{color:var(--mute);font-size:13px}
.li .aa{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--mute);font-size:12.5px;white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.tag.gold{color:var(--gold)}
.empty{color:var(--mute);text-align:center;padding:24px 0;border:1px dashed var(--line);border-radius:14px}
.irow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.irow .full{grid-column:1/-1}
.brow{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;margin:8px 0;font-size:14px}
.sec-note{background:color-mix(in srgb,var(--warn) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:12px;padding:10px 14px;color:var(--ink);font-size:13.5px;margin-bottom:14px}
/* المهام */
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.task.done .ttl{text-decoration:line-through;color:var(--mute)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--gold)}
.chk[aria-pressed="true"]::after{content:"✓";color:var(--goldink);font-size:14px;font-weight:700}
.ttl{font-weight:500;overflow-wrap:anywhere}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:12.5px}
.due{color:var(--mute)}.due.over{color:var(--bad);font-weight:600}.due.today{color:var(--warn);font-weight:600}
.pri{width:10px;height:10px;border-radius:50%;background:var(--line)}
.p-high{background:var(--bad)}.p-normal{background:var(--warn)}.p-low{background:var(--ok)}
.acts{display:flex;gap:6px}
.acts button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mute);padding:3px 9px;font-size:12.5px;cursor:pointer}
.acts button:hover{color:var(--ink);border-color:var(--gold)}
/* لوحة الأرقام الأربعة */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.init{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:8px}
.sv{display:flex;gap:6px}
.sv button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.sv button[aria-pressed="true"]{color:#0F1214;font-weight:600;border-color:transparent}
.sv .g[aria-pressed="true"]{background:var(--ok)}.sv .y[aria-pressed="true"]{background:var(--warn)}.sv .r[aria-pressed="true"]{background:var(--bad)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
th{background:var(--panel2);text-align:start;padding:9px 12px;font-weight:600;color:var(--mute);font-size:13px}
td{padding:9px 12px;border-top:1px solid var(--line)}
tr.cur td{background:color-mix(in srgb,var(--gold) 10%,transparent);font-weight:600}
/* القرآن */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.tile:hover{border-color:var(--gold)}
.tile b{display:block;font-size:14px;font-weight:600}
.tile span{font-size:12px;color:var(--mute)}
.tile.full{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.tile.part{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.tile .pb{height:5px;margin-top:5px}
/* النوافذ */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:0;width:min(560px,92vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlgh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-size:17px}
.dlgh .x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--mute)}
.dlgb{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld.full{grid-column:1/-1}
.fld .chk2{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin:0}
.dlgf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
/* لوحة الموقع */
.sitewrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.savebar{position:sticky;top:96px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.dirty{color:var(--warn);font-size:13.5px}
.prev{position:sticky;top:96px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prevbar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.pframe{position:relative;overflow:hidden;background:#000}
.pframe iframe{border:0;transform-origin:top right;display:block;background:var(--bg)}
.capcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--panel2)}
.capcard .irow{margin-bottom:8px}
.ordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ordrow:first-of-type{border-top:0}
.ordrow .tt{flex:1;font-weight:500}
.lbl2{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;max-width:90vw}
#toast.on{opacity:1}
#toast.bad{border-color:var(--bad);color:var(--bad)}
@media (max-width:860px){
 .sitewrap{grid-template-columns:1fr}.prev{position:static}.savebar{top:92px}
 .kpis{grid-template-columns:1fr 1fr}.notes,.two,.three{grid-template-columns:1fr}
 .task{grid-template-columns:auto 1fr auto}.acts{grid-column:1/-1}
 .dlgb{grid-template-columns:1fr}.brow{grid-template-columns:100px 1fr auto}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#toast,.pb>i{transition:none}}
</style>
</head>
<body>

<div id="login" class="center" hidden>
 <form class="card" id="loginForm" autocomplete="on">
  <h1>مساحتي</h1>
  <p class="sub">دخول خاص.</p>
  <div class="field"><label for="em">الإيميل</label><input id="em" type="email" name="email" autocomplete="username" required dir="ltr"></div>
  <div class="field"><label for="pw">كلمة السر</label><input id="pw" type="password" name="password" autocomplete="current-password" required dir="ltr"></div>
  <div class="err" id="loginErr" role="alert"></div>
  <button class="btn gold" id="loginBtn" style="width:100%;padding:11px" type="submit">دخول</button>
 </form>
</div>

<div id="app" hidden>
 <header class="top">
  <div class="bar">
   <span class="brand">مساحتي</span><span class="who" id="who"></span><span class="who" id="hijri"></span><span class="sp"></span>
   <button class="btn sm" id="backup" title="تنزيل نسخة من كل بياناتك">نسخة احتياطية</button>
   <button class="btn sm" id="logout">خروج</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
 </header>
 <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="../site-default.js"></script>
<script src="core.js"></script>
<script src="m-tasks.js"></script>
<script src="m-life.js"></script>
<script src="m-know.js"></script>
<script src="m-site.js"></script>
<script src="m-home.js"></script>
<script>boot();</script>
</body>
</html>
