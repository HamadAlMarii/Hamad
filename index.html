<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الربط</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16191a;--mute:#5d6669;--bg:#f2f3f1;--ok:#1f6b4f}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecea;--mute:#9aa4a6;--bg:#111516;--ok:#4fa37c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;line-height:1.8;padding:24px}
main{max-width:34em}
h1{font-size:clamp(34px,7vw,56px);margin:0 0 12px;font-weight:700}
h1::before{content:"";display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--ok);margin-left:.4em}
p{margin:0 0 14px;color:var(--mute);font-size:18px}
code{direction:ltr;unicode-bidi:embed;color:var(--ink);font-weight:600}
a{color:var(--ink)}
</style>
</head>
<body>
<main>
 <h1>الموقع يعمل</h1>
 <p>تفتح هذه الصفحة من العنوان <code id="h"></code>. معناها إن الملفات انرفعت صح، وإن الدومين مربوط.</p>
 <p>اختبر الآن <a href="/private/">المسار الخاص</a>. وبعدها نستبدل هذه الصفحة ببورتفوليو حمد.</p>
</main>
<script>document.getElementById('h').textContent=location.host</script>
</body>
</html>
