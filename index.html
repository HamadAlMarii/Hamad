<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حمد الجعيدي · متخصص تسويق رقمي</title>
<meta name="description" content="حمد الجعيدي، متخصص تسويق رقمي بخبرة تتجاوز 12 سنة في الاستراتيجية الرقمية والتجارة الإلكترونية والسوشال ميديا وإدارة العلامات.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1214;--ink:#ECE8DF;--mute:#9AA3A8;--line:#2A3136;--gold:#C9B27C;
 --f:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
main{max-width:980px;margin:0 auto;padding:12vh 28px 80px;display:grid;gap:56px}
h1{margin:0;font-size:clamp(56px,13vw,150px);line-height:.95;font-weight:700;letter-spacing:-.01em}
.en{direction:ltr;text-align:right;margin-top:18px;color:var(--gold);font-size:15px;letter-spacing:.28em}
.lead{font-size:clamp(19px,2.4vw,24px);max-width:30em;margin:0;color:var(--ink);font-weight:300}
.rule{height:1px;background:var(--line);border:0;margin:0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.metric{padding:6px 0 6px 28px}
.metric + .metric{padding-right:28px;border-right:1px solid var(--line)}
.metric b{display:block;font-size:clamp(30px,5vw,52px);font-weight:600;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.metric span{display:block;margin-top:6px;color:var(--mute);font-size:15px}
.note{margin:0;color:var(--mute);font-size:13.5px}
.links{display:flex;gap:28px;flex-wrap:wrap;font-size:17px}
.links a{text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:3px}
.links a:hover{color:var(--gold)}
@media (max-width:640px){
 .metrics{grid-template-columns:1fr;gap:22px}
 .metric,.metric + .metric{padding:0;border:0}
 main{padding-top:9vh}
}
</style>
</head>
<body>
<main>
 <header>
  <h1>حمد الجعيدي</h1>
  <div class="en">HAMAD AL-JAIDI</div>
 </header>
 <p class="lead">متخصص تسويق رقمي بخبرة تتجاوز 12 سنة في الاستراتيجية الرقمية والتجارة الإلكترونية والسوشال ميديا وإدارة العلامات التجارية.</p>
 <hr class="rule">
 <section aria-label="أرقام من مسيرتي المهنية">
  <div class="metrics">
   <div class="metric"><b>2,300%</b><span>عائد على الاستثمار</span></div>
   <div class="metric"><b>+500K</b><span>مجتمع رقمي بنيته</span></div>
   <div class="metric"><b>70%</b><span>نمو في المبيعات</span></div>
  </div>
  <p class="note" style="margin-top:18px">أرقام حققتها عبر مناصب سابقة.</p>
 </section>
 <nav class="links" aria-label="روابط">
  <a href="https://www.linkedin.com/in/hamadaljaidi" target="_blank" rel="noopener">LinkedIn</a>
 </nav>
</main>
</body>
</html>
